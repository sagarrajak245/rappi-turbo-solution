# Business parameters for the purchasing agent.
# Secrets and connection strings live in .env, never here.
# Environment variables override these values (e.g. PLANNING__SERVICE_LEVEL=0.98).

app:
  name: rappi-turbo
  currency: INR
  branch: Mumbai

database:
  # Used only when DATABASE_URL is empty.
  sqlite_path: backend/data/app.db

logging:
  level: INFO
  json_format: true

planning:
  order_cycle_days: 7            # R in P = L + R
  service_level: 0.95            # -> z via the table below
  z_table:                       # service level -> z (no scipy needed)
    0.90: 1.28
    0.95: 1.65
    0.98: 2.05
    0.99: 2.33
  sales_window_days: 28          # history used for sigma and the forecast fallback
  accept_tolerance_pct: 0.10     # |rec - Q| <= max(1 case, 10% of rec) -> ACCEPT
  max_cover_days: 21             # soft: overstock above this
  max_deviation_from_rec_pct: 0.50  # soft: larger deviations need a reason
  shelf_life_safety_days: 1      # sell-by margin before expiry

data_quality:
  snapshot_max_age_hours: 24     # older -> blocking (INVESTIGATE)
  forecast_sales_gap_warn_pct: 0.25
  forecast_sales_gap_block_pct: 0.50   # strictly greater -> blocking
  injection_patterns:            # supplier/product notes matching these are flagged, never obeyed
    - "ignore (all |any )?(previous|prior) instructions"
    - "you are now"
    - "system prompt"
    - "approve (this|the) order"

erp:
  price_tolerance_pct: 0.02      # draft unit price may differ this much before it is a deviation
  eta_tolerance_days: 1
  max_replans: 1

llm:
  # Model ids and prices (USD per million tokens) for cost tracking. Keys live in .env.
  decision: {provider: groq, model: openai/gpt-oss-120b, price_in_per_mtok_usd: 0.15, price_out_per_mtok_usd: 0.60}
  reviewer: {provider: groq, model: qwen/qwen3.8-27b, price_in_per_mtok_usd: 0.29, price_out_per_mtok_usd: 0.59}
  fallback: {provider: gemini, model: gemini-2.5-flash, price_in_per_mtok_usd: 0.30, price_out_per_mtok_usd: 2.50}
  timeout_s: 30
  max_invalid_retries: 1   # retry once on invalid JSON, then fall back
  max_review_attempts: 2   # reviewer fails twice -> ESCALATE (R7)
  max_tool_calls: 4        # read-only investigation calls per decision (D22)
